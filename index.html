*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{background:#080620;color:#F1F5F9;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background 0.3s,color 0.3s;height:100%;position:fixed;width:100%;touch-action:manipulation}
input,textarea{font-family:inherit;font-size:16px}
button{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A2760;border-radius:4px}
::selection{background:#6366F155;color:#fff}
@supports(padding-bottom:env(safe-area-inset-bottom)){.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,0.3)}50%{box-shadow:0 0 40px rgba(99,102,241,0.6)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes tabIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
</style>

// ─── AI CALL ─────────────────────────────────────────────
async function callAI(prompt, lang){
  try{
    const res=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,lang})});
    const data=await res.json();
    if(data.error)return{ok:false,text:data.error};
    return{ok:true,text:data.text};
  }catch(e){return{ok:false,text:e.message}}
}

// ─── AI STATUS CHECK ─────────────────────────────────────
function useAIStatus(){
  const[aiReady,setAiReady]=useState(false);
  useEffect(()=>{
    fetch("/api/status").then(r=>r.json()).then(d=>setAiReady(d.ai)).catch(()=>setAiReady(false));
  },[]);
  return aiReady;
}

// ─── AI RESPONSE CARD ────────────────────────────────────
const AICard=({text,loading,t})=>(
  <div style={{background:C.bgCard,borderRadius:14,border:`1px solid ${C.border}`,borderLeft:`4px solid ${C.accent}`,padding:16,marginTop:12,animation:"fadeIn 0.4s ease-out"}}>
    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
      <span style={{background:`linear-gradient(135deg,${C.aiGold},#F59E0B)`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",fontWeight:900,fontSize:13}}>🤖 AI</span>
    </div>
    {loading?
      <div style={{display:"flex",alignItems:"center",gap:8,color:C.textSec,fontSize:13}}>
        <div style={{width:16,height:16,border:`2px solid ${C.accent}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
        {t.ai_loading}
      </div>
    :
      <div style={{color:C.textSec,fontSize:13,lineHeight:1.7,whiteSpace:"pre-wrap"}}>{text}</div>
    }
  </div>
);

// ─── AI BUTTON ───────────────────────────────────────────
const AIButton=({label,onClick,disabled})=>(
  <button onClick={onClick} disabled={disabled} style={{background:disabled?"#333":`linear-gradient(135deg,${C.aiGold},#F59E0B)`,color:disabled?C.textMut:"#000",border:"none",borderRadius:12,padding:"10px 18px",fontSize:13,fontWeight:800,cursor:disabled?"default":"pointer",opacity:disabled?0.5:1,transition:"all 0.2s",display:"flex",alignItems:"center",gap:6,margin:"12px 0"}}>
    <span>🤖</span>{label}
  </button>
);

const TypeBadge=({type,small})=>{
  const bg={Attack:C.attack,Defense:C.defense,Stamina:C.stamina,Balance:C.balance}[type];
  return <span style={{background:bg,color:"#fff",fontWeight:800,fontSize:small?9:11,padding:small?"1px 6px":"2px 8px",borderRadius:4,letterSpacing:.5,textTransform:"uppercase"}}>{type}</span>;
};
const TierBadge=({tier})=>{
  const c={"S+":"#FFD700",S:"#C084FC",A:"#60A5FA",B:"#4ADE80",C:"#9CA3AF"}[tier]||"#888";
  return <span style={{border:`1.5px solid ${c}`,color:c,fontSize:10,fontWeight:900,padding:"1px 5px",borderRadius:4}}>{tier}</span>;
};

const TS={"S+":100,S:85,A:70,B:55,C:40};
function genDeck(bIds,rIds,biIds,seed=0){const bs=BLADES.filter(b=>bIds.includes(b.id)),rs=RATCHETS.filter(r=>rIds.includes(r.id)),bi=BITS.filter(b=>biIds.includes(b.id));if(bs.length<3||rs.length<3||bi.length<3)return null;const combos=[];bs.forEach(bl=>{rs.forEach(r=>{bi.forEach(bt=>{let sc=TS[bl.tier]||50;sc+=bl.w*.5;if((bl.type==="Attack"&&["Attack","Balance"].includes(bt.type))||(bl.type==="Defense"&&["Defense","Stamina"].includes(bt.type))||(bl.type==="Stamina"&&["Stamina","Balance"].includes(bt.type))||(bl.type==="Balance"))sc+=15;if(bl.type==="Attack")sc+=bt.mob*2;else if(bl.type==="Defense")sc+=bt.stb*2;else if(bl.type==="Stamina")sc+=bt.sta*2;else sc+=bt.mob+bt.sta+bt.stb;if(bl.type==="Attack"&&r.h===60)sc+=10;else if(bl.type!=="Attack"&&r.h>=70)sc+=10;combos.push({blade:bl,ratchet:r,bit:bt,sc:Math.round(sc)})})})});combos.sort((a,b)=>b.sc-a.sc);if(seed>0){let h=seed;for(let i=combos.length-1;i>0;i--){h=(h*16807+0)%2147483647;const j=h%Math.min(i+1,Math.max(5,Math.floor(combos.length*0.3)));if(Math.abs(combos[i].sc-combos[j].sc)<=5){const tmp=combos[i];combos[i]=combos[j];combos[j]=tmp}}};const sel=[],uB=new Set,uR=new Set,uBi=new Set;for(const c of combos){if(sel.length>=3)break;if(uB.has(c.blade.id)||uR.has(c.ratchet.id)||uBi.has(c.bit.id))continue;sel.push(c);uB.add(c.blade.id);uR.add(c.ratchet.id);uBi.add(c.bit.id)}if(sel.length<3)return null;const roles=["opener","reinforcer","finisher"];sel.sort((a,b)=>{const o={Attack:0,Balance:1,Stamina:2,Defense:2};return(o[a.blade.type]||1)-(o[b.blade.type]||1)});return sel.map((c,i)=>({...c,role:roles[i]}))}
function bestCombo(blade,ownedRIds,ownedBiIds){const rs=RATCHETS.filter(r=>ownedRIds.includes(r.id)),bi=BITS.filter(b=>ownedBiIds.includes(b.id));if(!rs.length||!bi.length)return null;let bestR=rs[0],bestBi=bi[0],bestSc=-1;rs.forEach(r=>{bi.forEach(bt=>{let sc=0;if(blade.type==="Attack"){sc+=bt.mob*3;if(r.h===60)sc+=10}else if(blade.type==="Defense"){sc+=bt.stb*3;if(r.h>=70)sc+=10}else if(blade.type==="Stamina"){sc+=bt.sta*3;if(r.h>=70)sc+=10}else{sc+=bt.mob+bt.sta+bt.stb;if(r.h>=60&&r.h<=70)sc+=5}if(sc>bestSc){bestSc=sc;bestR=r;bestBi=bt}})});return{ratchet:bestR,bit:bestBi}}
function cScore(bl,opp){const adv={Attack:{Stamina:30,Balance:10,Attack:0,Defense:-20},Defense:{Attack:30,Balance:5,Defense:0,Stamina:-20},Stamina:{Defense:30,Balance:5,Stamina:0,Attack:-20},Balance:{Attack:5,Defense:5,Stamina:5,Balance:0}};let sc=50+(adv[bl.type]?.[opp]||0);sc+=({"S+":25,S:20,A:15,B:10,C:5}[bl.tier]||5);if(bl.spin==="L"&&opp!=="Attack")sc+=15;if(bl.w>=35&&opp==="Attack")sc+=10;return Math.max(0,Math.min(100,sc))}
function lTip(bl,r,bt){if(bl.type==="Attack"&&bt.mob>=7)return{p:"FULL",a:"15° inward",s:`${bl.name} + ${bt.name}: full-power entry. KO in 5s or lose.`,w:r.teeth<=2?"⚠️ Low teeth = burst risk!":""};if(bl.type==="Defense")return{p:"SOFT",a:"Straight down",s:`${bl.name}: center lock. Let them come. ${bt.name} holds.`,w:""};if(bl.type==="Stamina")return{p:"SOFT",a:"5° tilt",s:`${bl.name} + ${bt.name}: outspin. Min wobble, max spin.`,w:bt.mob>=6?"⚠️ High mobility on stamina = drain":""};return{p:"MEDIUM",a:"10° angle",s:`${bl.name} (Balance): adapt. ${bt.name} = flexibility.`,w:""}}

  const[aiRes,setAiRes]=useState(null);const[aiLoad,setAiLoad]=useState(false);

  const rI={opener:"🎯",reinforcer:"⚡",finisher:"🛡️"};const rC={opener:C.attack,reinforcer:C.balance,finisher:C.defense};
  const tc={Attack:C.attack,Defense:C.defense,Stamina:C.stamina,Balance:C.balance};

    if(!deck||!aiReady)return;setAiLoad(true);setAiRes(null);
    const desc=deck.map((c,i)=>`${i+1}. ${c.role}: ${c.blade.name} (${c.blade.type}, ${c.blade.tier}) + ${c.ratchet.name} + ${c.bit.name} (${c.bit.id})`).join("\n");
    const prompt=`Analyse ce deck tournoi Beyblade X 3v3 :\n${desc}\n\nDonne :\n1. Forces et faiblesses de ce deck\n2. Matchups dangereux (quels types/combos vont poser problème)\n3. Conseils de lancement spécifiques pour chaque combo\n4. Note globale /10 avec justification\n\nSois concis mais précis.`;
    const res=await callAI(prompt,lang);
    setAiRes(res.text);setAiLoad(false);
  };

  if(!deck)return(<div style={{textAlign:"center",padding:"40px 20px",animation:"fadeIn 0.5s ease-out"}}><img src={IMG.stadium} width={220} style={{borderRadius:12,opacity:0.7,marginBottom:16,filter:"drop-shadow(0 0 20px rgba(99,102,241,0.4))"}}/><h3 style={{margin:"0 0 8px",fontWeight:800,fontSize:18}}>{t.not_enough}</h3><p style={{color:C.textSec,fontSize:14}}>{t.add_parts}</p></div>);
  const total=deck.reduce((s,c)=>s+c.sc,0);const types=new Set(deck.map(c=>c.blade.type));

  return(<>
    <h2 style={{fontSize:22,fontWeight:900,margin:"10px 0 3px",textShadow:`0 0 15px ${C.accent}66`}}>{t.tournament_deck}</h2>
    <p style={{color:C.textSec,fontSize:13,margin:"0 0 14px"}}>{t.optimized}</p>
    {(()=>{
      // Calculate deck stats: Attack, Defense, Stamina, Balance (the 4 Beyblade types)
      const atkScore=Math.min(10,Math.round(deck.reduce((s,c)=>{let v=0;if(c.blade.type==="Attack")v+=3;if(c.blade.type==="Balance")v+=1;v+=c.bit.mob*0.2;if(c.blade.w>=35)v+=0.3;return s+v},0)));
      const defScore=Math.min(10,Math.round(deck.reduce((s,c)=>{let v=0;if(c.blade.type==="Defense")v+=3;if(c.blade.type==="Balance")v+=1;v+=c.bit.stb*0.2;if(c.ratchet.h>=80)v+=0.3;return s+v},0)));
      const staScore=Math.min(10,Math.round(deck.reduce((s,c)=>{let v=0;if(c.blade.type==="Stamina")v+=3;if(c.blade.type==="Balance")v+=1;v+=c.bit.sta*0.2;if(c.ratchet.h>=70)v+=0.3;return s+v},0)));
      const balScore=Math.min(10,Math.round((atkScore+defScore+staScore)/3+deck.reduce((s,c)=>s+(c.blade.type==="Balance"?1.5:0),0)));
      const tierAvg=Math.round(deck.reduce((s,c)=>s+(TS[c.blade.tier]||50),0)/3);
      const stats=[
        {label:t.attack||"Attack",val:atkScore,color:C.attack,icon:<TypeIcon type="Attack" size={20}/>,desc:t.stat_atk_desc||"Speed, KO power, aggressive strikes"},
        {label:t.defense||"Defense",val:defScore,color:C.defense,icon:<TypeIcon type="Defense" size={20}/>,desc:t.stat_def_desc||"Stability, hit absorption, resistance"},
        {label:t.stamina||"Stamina",val:staScore,color:C.stamina,icon:<TypeIcon type="Stamina" size={20}/>,desc:t.stat_sta_desc||"Spin duration, endurance, outspin"},
        {label:t.balance_t||"Balance",val:balScore,color:C.balance,icon:<TypeIcon type="Balance" size={20}/>,desc:t.stat_bal_desc||"Versatility, adaptability, coverage"},
      ];
      return(
      <div style={{background:C.bgCard,borderRadius:16,border:`1px solid ${C.border}`,padding:16,marginBottom:14}}>
        <div style={{marginBottom:14}}>
          <span style={{fontSize:12,fontWeight:800,color:C.accent,letterSpacing:1,textTransform:"uppercase"}}>{t.deck_stats||"Deck Stats"}</span>
        </div>
        {stats.map((s,i)=>(
          <div key={i} style={{marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
              <span style={{fontSize:13,width:20,textAlign:"center"}}>{s.icon}</span>
              <span style={{fontSize:11,fontWeight:700,color:C.textSec,width:70,flexShrink:0}}>{s.label}</span>
              <div style={{flex:1,height:8,background:C.bg,borderRadius:4,overflow:"hidden",position:"relative"}}>
                <div style={{height:"100%",width:`${s.val*10}%`,background:`linear-gradient(90deg,${s.color}88,${s.color})`,borderRadius:4,transition:"width 0.6s ease-out",boxShadow:`0 0 8px ${s.color}44`}}/>
              </div>
              <span style={{fontSize:12,fontWeight:800,color:s.color,width:24,textAlign:"right"}}>{s.val}</span>
            </div>
            <div style={{fontSize:10,color:C.textMut,paddingLeft:28,lineHeight:1.3}}>{s.desc}</div>
          </div>
        ))}
        <div style={{marginTop:10,paddingTop:10,borderTop:`1px solid ${C.border}`,display:"flex",gap:6,flexWrap:"wrap"}}>
          {types.size>=3?<span style={{fontSize:11,color:C.success,fontWeight:700}}>✅ {t.deck_coverage_3||"3 types — excellent coverage"}</span>
          :types.size===2?<span style={{fontSize:11,color:C.warning,fontWeight:700}}>⚠️ {t.deck_coverage_2||"2 types — consider a 3rd"}</span>
          :<span style={{fontSize:11,color:C.attack,fontWeight:700}}>❌ {t.deck_coverage_1||"Same type — risky matchups"}</span>}
          <span style={{fontSize:10,color:C.textMut,marginLeft:"auto"}}>{t.deck_tier_avg||"Tier avg"}: {tierAvg}</span>
        </div>
      </div>);
    })()}
    <div style={{fontSize:11,fontWeight:800,color:C.accent,letterSpacing:1.5,marginBottom:10,textTransform:"uppercase"}}>{t.play_order}</div>
    {deck.map((c,i)=>{const color=tc[c.blade.type];const tip=lTip(c.blade,c.ratchet,c.bit);return(
      <div key={i} style={{background:C.bgCard,borderRadius:16,border:`2px solid ${color}`,padding:16,marginBottom:12,boxShadow:`0 0 25px ${color}15`,animation:`fadeIn 0.4s ease-out ${i*0.15}s both`}}>
        <div style={{display:"inline-flex",alignItems:"center",gap:5,background:rC[c.role],padding:"3px 12px",borderRadius:8,marginBottom:12}}><span style={{fontSize:13}}>{rI[c.role]}</span><span style={{color:"#fff",fontSize:11,fontWeight:800}}>{rL[c.role]}</span></div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <TypeIcon type={c.blade.type} size={52} glow/>
          <div style={{flex:1}}><div style={{fontSize:17,fontWeight:800}}>{c.blade.name}</div><div style={{color:C.textSec,fontSize:13,marginTop:2}}>{c.ratchet.name} • {c.bit.name} ({c.bit.id})</div><div style={{display:"flex",gap:5,marginTop:5}}><TypeBadge type={c.blade.type} small/><TierBadge tier={c.blade.tier}/><span style={{color:C.textMut,fontSize:11}}>{c.blade.w}g</span></div></div>
          <div style={{width:50,height:50,borderRadius:25,border:`2px solid ${color}`,display:"flex",alignItems:"center",justifyContent:"center",background:C.bg,flexShrink:0}}><span style={{color,fontSize:15,fontWeight:900}}>{c.sc}</span></div>
        </div>
        <div style={{background:C.bg,borderRadius:12,padding:12,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:10,fontWeight:700,color:C.accent,textTransform:"uppercase",marginBottom:5,letterSpacing:.5}}>{t.launch_tip}</div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}><span style={{fontSize:14}}>{tip.p==="FULL"?"💥":tip.p==="SOFT"?"🌊":"⚡"}</span><span style={{fontWeight:700,fontSize:13}}>{t.power}: {tip.p}</span><span style={{color:C.textMut,fontSize:11}}>• {tip.a}</span></div>
          <div style={{color:C.textSec,fontSize:12,lineHeight:1.5}}>{tip.s}</div>
          {tip.w&&<div style={{color:C.warning,fontSize:11,marginTop:6,fontStyle:"italic"}}>{tip.w}</div>}
        </div>
      </div>
    )})}
    {/* RE-GENERATE */}
    <div style={{display:"flex",alignItems:"center",gap:10,margin:"14px 0"}}>
      <button onClick={()=>setSeed(s=>s+1)} style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:12,padding:"10px 20px",color:C.text,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6,transition:"all 0.2s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>🔄 {t.regen||"Re-generate"}</button>
      {seed>0&&<span style={{color:C.textMut,fontSize:11,fontWeight:600}}>Variante #{seed+1}</span>}
    </div>
    {/* COMBO SUGGESTIONS */}
    {(()=>{
      const ownedBIds=Object.keys(col.blades),ownedRIds=Object.keys(col.ratchets),ownedBiIds=Object.keys(col.bits);
      const deckTypes=deck.map(c=>c.blade.type);
      const weakestIdx=deck.reduce((wi,c,i)=>c.sc<deck[wi].sc?i:wi,0);
      const weakest=deck[weakestIdx];
      const allB=BLADES.filter(b=>!b.id.startsWith("cx_")).sort((a,b)=>(TS[b.tier]||0)-(TS[a.tier]||0));
      const allR=RATCHETS.slice().sort((a,b)=>b.h-a.h);
      const allBi=BITS.sort((a,b)=>(b.sta+b.stb+b.mob)-(a.sta+a.stb+a.mob));
      const bestR=allR.find(r=>ownedRIds.includes(r.id))||allR[0];
      const bestBi=allBi.find(b=>ownedBiIds.includes(b.id))||allBi[0];
      const pickRatchet=(type)=>{if(type==="Attack")return allR.find(r=>ownedRIds.includes(r.id)&&r.teeth>=4)||allR.find(r=>r.teeth>=4)||allR[0];if(type==="Defense")return allR.find(r=>ownedRIds.includes(r.id)&&r.teeth>=5)||allR.find(r=>r.teeth>=5)||allR[0];if(type==="Stamina")return allR.find(r=>ownedRIds.includes(r.id)&&r.h>=75)||allR.find(r=>r.h>=75)||allR[0];return bestR;};
      const pickBit=(type)=>{if(type==="Attack")return allBi.find(b=>ownedBiIds.includes(b.id)&&b.type==="Attack")||allBi.find(b=>b.type==="Attack")||allBi[0];if(type==="Defense")return allBi.find(b=>ownedBiIds.includes(b.id)&&b.type==="Defense")||allBi.find(b=>b.type==="Defense")||allBi[0];if(type==="Stamina")return allBi.find(b=>ownedBiIds.includes(b.id)&&b.type==="Stamina")||allBi.find(b=>b.type==="Stamina")||allBi[0];return bestBi;};
      const combos=[];
      const usedBlades=new Set();
      // 1) Cover missing type
      const needDef=!deckTypes.includes("Defense"),needSta=!deckTypes.includes("Stamina"),needAtk=!deckTypes.includes("Attack");
      if(needDef){const bl=allB.find(b=>b.type==="Defense"&&!usedBlades.has(b.id));if(bl){usedBlades.add(bl.id);const r=pickRatchet("Defense"),bi=pickBit("Defense");combos.push({blade:bl,ratchet:r,bit:bi,reason:t.sug_no_def||"Your deck has no Defense — this combo tanks hits and covers your weakness",owned:{b:ownedBIds.includes(bl.id),r:ownedRIds.includes(r.id),bi:ownedBiIds.includes(bi.id)}});}}
      if(needSta){const bl=allB.find(b=>b.type==="Stamina"&&!usedBlades.has(b.id));if(bl){usedBlades.add(bl.id);const r=pickRatchet("Stamina"),bi=pickBit("Stamina");combos.push({blade:bl,ratchet:r,bit:bi,reason:t.sug_no_sta||"No Stamina — this combo outspins opponents in long matches",owned:{b:ownedBIds.includes(bl.id),r:ownedRIds.includes(r.id),bi:ownedBiIds.includes(bi.id)}});}}
      if(needAtk){const bl=allB.find(b=>b.type==="Attack"&&!usedBlades.has(b.id));if(bl){usedBlades.add(bl.id);const r=pickRatchet("Attack"),bi=pickBit("Attack");combos.push({blade:bl,ratchet:r,bit:bi,reason:t.sug_no_atk||"No Attack — this combo gives maximum KO power",owned:{b:ownedBIds.includes(bl.id),r:ownedRIds.includes(r.id),bi:ownedBiIds.includes(bi.id)}});}}
      // 2) Upgrade weakest combo
      if(combos.length<3){const upgrade=allB.find(b=>b.type===weakest.blade.type&&!usedBlades.has(b.id)&&(TS[b.tier]||0)>(TS[weakest.blade.tier]||0));if(upgrade){usedBlades.add(upgrade.id);const r=pickRatchet(upgrade.type),bi=pickBit(upgrade.type);combos.push({blade:upgrade,ratchet:r,bit:bi,reason:(t.sug_replace||"Replaces")+` ${weakest.blade.name} (${weakest.blade.tier}) — tier upgrade to ${upgrade.tier}`,owned:{b:ownedBIds.includes(upgrade.id),r:ownedRIds.includes(r.id),bi:ownedBiIds.includes(bi.id)}});}}
      // 3) Meta combo
      if(combos.length<3){for(const bl of allB){if(combos.length>=3)break;if(usedBlades.has(bl.id))continue;if(bl.tier==="S+"||bl.tier==="S"){usedBlades.add(bl.id);const r=pickRatchet(bl.type),bi=pickBit(bl.type);combos.push({blade:bl,ratchet:r,bit:bi,reason:(t.sug_meta||"Meta pick")+` — ${bl.type} ${bl.tier}`,owned:{b:ownedBIds.includes(bl.id),r:ownedRIds.includes(r.id),bi:ownedBiIds.includes(bi.id)}});}}}
      combos.sort((a,b)=>{const oa=(a.owned.b?1:0)+(a.owned.r?1:0)+(a.owned.bi?1:0);const ob=(b.owned.b?1:0)+(b.owned.r?1:0)+(b.owned.bi?1:0);return ob-oa});
      if(!combos.length)return null;
      const tc2={Attack:C.attack,Defense:C.defense,Stamina:C.stamina,Balance:C.balance};
      return(<div style={{marginTop:16}}>
        <div style={{fontSize:12,fontWeight:800,color:C.gold,letterSpacing:1.5,marginBottom:10,textTransform:"uppercase"}}>🛒 {t.upgrade_suggestions||"Combo Suggestions"}</div>
        {combos.map((co,i)=>{
          const total=co.blade.price+(co.ratchet.price||5)+(co.bit.price||5);
          const ownAll=co.owned.b&&co.owned.r&&co.owned.bi;
          const ownCount=(co.owned.b?1:0)+(co.owned.r?1:0)+(co.owned.bi?1:0);
          return(<div key={i} style={{background:ownAll?`${C.bgCard}`:C.bgCard,borderRadius:14,border:`1px solid ${tc2[co.blade.type]||C.border}44`,padding:"14px",marginBottom:10,animation:`fadeIn 0.3s ease-out ${i*0.12}s both`}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <TypeIcon type={co.blade.type} size={22}/>
                <span style={{fontSize:14,fontWeight:800,color:C.text}}>{co.blade.name}</span>
                <span style={{fontSize:9,fontWeight:800,color:C.gold,background:`${C.gold}22`,padding:"1px 5px",borderRadius:4}}>{co.blade.tier}</span>
              </div>
              <span style={{fontSize:13,fontWeight:800,color:C.success}}>~{total}€</span>
            </div>
            <div style={{display:"flex",gap:6,marginBottom:8}}>
              <div style={{flex:1,background:C.bgHover,borderRadius:8,padding:"6px 8px",textAlign:"center"}}>
                <div style={{fontSize:8,color:C.textMut,fontWeight:700,textTransform:"uppercase",marginBottom:2}}>Blade</div>
                <div style={{fontSize:11,fontWeight:700,color:tc2[co.blade.type]||C.text}}>{co.blade.name}</div>
                {co.owned.b&&<span style={{fontSize:8,color:C.success}}>✓</span>}
              </div>
              <div style={{flex:1,background:C.bgHover,borderRadius:8,padding:"6px 8px",textAlign:"center"}}>
                <div style={{fontSize:8,color:C.textMut,fontWeight:700,textTransform:"uppercase",marginBottom:2}}>Ratchet</div>
                <div style={{fontSize:11,fontWeight:700,color:C.text}}>{co.ratchet.name||co.ratchet.id}</div>
                {co.owned.r&&<span style={{fontSize:8,color:C.success}}>✓</span>}
              </div>
              <div style={{flex:1,background:C.bgHover,borderRadius:8,padding:"6px 8px",textAlign:"center"}}>
                <div style={{fontSize:8,color:C.textMut,fontWeight:700,textTransform:"uppercase",marginBottom:2}}>Bit</div>
                <div style={{fontSize:11,fontWeight:700,color:C.text}}>{co.bit.id}</div>
                {co.owned.bi&&<span style={{fontSize:8,color:C.success}}>✓</span>}
              </div>
            </div>
            <div style={{fontSize:11,color:C.textSec,lineHeight:1.4}}>{co.reason}</div>
            {ownCount>0&&!ownAll&&<div style={{fontSize:9,color:C.accent,marginTop:4,fontWeight:600}}>{ownCount}/3 {t.already_owned||"pieces already owned"}</div>}
            {ownAll&&<div style={{fontSize:9,color:C.success,marginTop:4,fontWeight:700}}>{t.combo_ready||"You own everything — combo ready!"}</div>}
          </div>);
        })}
      </div>);
    })()}
    <DeckShare deck={deck} t={t}/>
    {/* AI ANALYSIS */}
    <AIButton label={t.ai_analysis} onClick={askAI} disabled={!aiReady||aiLoad}/>
    {!aiReady&&<p style={{color:C.textMut,fontSize:11,fontStyle:"italic",marginTop:-6}}>⚡ {t.ai_no_key}</p>}
    {(aiLoad||aiRes)&&<AICard text={aiRes} loading={aiLoad} t={t}/>}
  </>);
};

// ─── BATTLE TAB (with AI) ────────────────────────────────
const BattleTab=({col,t,lang,aiReady,onCounterPick,matchHistory,addMatch})=>{
  const[opp,setOpp]=useState(null);const[aiRes,setAiRes]=useState(null);const[aiLoad,setAiLoad]=useState(false);
  const types=["Attack","Defense","Stamina","Balance"];
  const tc={Attack:C.attack,Defense:C.defense,Stamina:C.stamina,Balance:C.balance};
  const tn={Attack:t.attack,Defense:t.defense,Stamina:t.stamina,Balance:t.balance_t};
  const counters={Attack:"Defense",Defense:"Stamina",Stamina:"Attack",Balance:"Attack"};
  const owned=BLADES.filter(b=>col.blades[b.id]);
  const results=opp?owned.map(b=>({blade:b,sc:cScore(b,opp)})).sort((a,b)=>b.sc-a.sc):[];

  const askAI=async()=>{
    if(!opp||!aiReady||results.length===0)return;setAiLoad(true);setAiRes(null);
    const top3=results.slice(0,3).map(r=>`${r.blade.name} (${r.blade.type}, ${r.blade.tier}, ${r.sc}%)`).join(", ");
    const prompt=`Mon adversaire joue un type ${opp} en Beyblade X. Mes meilleures blades contre lui : ${top3}.\n\nDonne-moi :\n1. La stratégie détaillée pour battre un ${opp}\n2. Quel combo (blade+ratchet+bit) construire avec ma meilleure blade\n3. Technique de lancement précise (puissance, angle, position dans le stadium)\n4. Mindgames et astuces psychologiques\n\nSois concis, style coach anime.`;
    const res=await callAI(prompt,lang);
    setAiRes(res.text);setAiLoad(false);
  };

  // Reset AI when opponent changes
  useEffect(()=>{setAiRes(null);setAiLoad(false)},[opp]);

  // Matchup matrix: rows = your type, cols = opponent type
  const matchData=[
    {you:"Attack",vs:{Attack:50,Defense:20,Stamina:80,Balance:55}},
    {you:"Defense",vs:{Attack:80,Defense:50,Stamina:20,Balance:55}},
    {you:"Stamina",vs:{Attack:20,Defense:80,Stamina:50,Balance:55}},
    {you:"Balance",vs:{Attack:50,Defense:50,Stamina:50,Balance:50}},
  ];
  const cellColor=(v)=>v>=70?C.success:v>=50?C.balance:v>=30?C.warning:C.attack;

  return(<>
    <h2 style={{fontSize:22,fontWeight:900,margin:"10px 0 3px",textShadow:`0 0 15px ${C.attack}66`}}>{t.counter_picking}</h2>
    <p style={{color:C.textSec,fontSize:13,margin:"0 0 14px"}}>{t.choose_opp}</p>
    {/* MATCHUP CHART */}
    <div style={{background:C.bgCard,borderRadius:14,border:`1px solid ${C.border}`,padding:12,marginBottom:16,overflow:"hidden"}}>
      <div style={{fontSize:10,fontWeight:800,color:C.accent,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>⚡ {t.matchup_chart||"Type Matchups"}</div>
      <div style={{display:"grid",gridTemplateColumns:"50px repeat(4,1fr)",gap:2}}>
        <div/>
        {types.map(tp=><div key={tp} style={{textAlign:"center",fontSize:9,fontWeight:800,color:tc[tp],padding:"4px 0"}}>{tn[tp]}</div>)}
        {matchData.map(row=><React.Fragment key={row.you}>
          <div style={{fontSize:9,fontWeight:800,color:tc[row.you],display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:6}}>{tn[row.you]}</div>
          {types.map(tp=>{const v=row.vs[tp];return(
            <div key={tp} style={{background:`${cellColor(v)}22`,borderRadius:6,textAlign:"center",padding:"6px 2px",fontSize:11,fontWeight:800,color:cellColor(v),border:`1px solid ${cellColor(v)}33`}}>{v}%</div>
          )})}
        </React.Fragment>)}
      </div>
      <div style={{display:"flex",gap:10,marginTop:10,justifyContent:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:9,color:C.success}}>■ 70%+ {t.matchup_strong||"Strong"}</span>
        <span style={{fontSize:9,color:C.balance}}>■ 50% {t.matchup_even||"Even"}</span>
        <span style={{fontSize:9,color:C.attack}}>■ 20% {t.matchup_weak||"Weak"}</span>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
      {types.map(tp=>{const sel=opp===tp;return(
        <div key={tp} onClick={()=>{setOpp(tp);onCounterPick&&onCounterPick()}} style={{background:sel?tc[tp]:C.bgCard,borderRadius:16,border:`1px solid ${sel?tc[tp]:C.border}`,padding:"16px 12px",cursor:"pointer",textAlign:"center",transition:"all 0.2s",boxShadow:sel?`0 0 30px ${tc[tp]}33`:"none"}}>
          <div style={{display:"flex",justifyContent:"center",marginBottom:6}}><TypeIcon type={tp} size={42} glow={sel}/></div>
          <div style={{fontWeight:800,fontSize:14,color:sel?"#fff":C.text}}>{tn[tp]}</div>
        </div>
      )})}
    </div>
    {opp&&<div style={{background:C.bgCard,borderRadius:14,border:`2px solid ${tc[counters[opp]]}`,padding:14,marginBottom:16,animation:"fadeIn 0.3s ease-out"}}>
      <div style={{fontSize:10,fontWeight:700,color:C.textMut,textTransform:"uppercase",letterSpacing:.5}}>Recommended counter</div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:6}}><TypeIcon type={counters[opp]} size={36} glow/><span style={{fontSize:18,fontWeight:900,color:tc[counters[opp]]}}>{tn[counters[opp]]}</span><span style={{color:C.textSec,fontSize:13}}>{t.beats} {tn[opp]}</span></div>
    </div>}
    {opp&&results.length>0&&<>
      <div style={{fontWeight:800,fontSize:14,marginBottom:10}}>{t.your_best} {tn[opp]}</div>

        <div key={r.blade.id} style={{background:C.bgCard,borderRadius:14,border:i===0?`2px solid ${C.success}`:`1px solid ${C.border}`,padding:14,marginBottom:8,boxShadow:i===0?`0 0 20px ${C.success}22`:"none",position:"relative",animation:`fadeIn 0.3s ease-out ${i*0.08}s both`}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>

              <div style={{height:4,borderRadius:2,background:`${barC}22`,marginTop:6,overflow:"hidden"}}><div style={{height:"100%",width:`${r.sc}%`,background:barC,borderRadius:2,transition:"width 0.5s"}}/></div>
            </div>
            <span style={{fontSize:18,fontWeight:900,color:barC}}>{r.sc}%</span>
            {i===0&&<span style={{position:"absolute",right:10,top:8,background:C.success,color:"#fff",fontSize:8,fontWeight:900,padding:"2px 8px",borderRadius:4,letterSpacing:.5}}>{t.best_pick}</span>}
          </div>
          {i<3&&combo&&<div style={{background:C.bg,borderRadius:10,border:`1px solid ${C.border}`,padding:"8px 12px",marginTop:8,marginLeft:30}}>
            <span style={{fontSize:10,fontWeight:700,color:C.accent}}>{t.recommended_combo||"Recommended combo"}</span>

          </div>}

      )})}

};

// ─── AI COACH TAB ──────────────────────────────────────
const AICoachTab=({t,col,matchHistory,lang})=>{
  const[messages,setMessages]=useState(()=>LS.load("aiChat",[]));
  const[input,setInput]=useState("");
  const[loading,setLoading]=useState(false);
  useEffect(()=>LS.save("aiChat",messages),[messages]);
  const messagesEndRef=useRef(null);

  const scrollToBottom=()=>messagesEndRef.current?.scrollIntoView({behavior:"smooth"});
  useEffect(scrollToBottom,[messages]);

  const getOwnedBlades=()=>BLADES.filter(b=>col.blades?.[b.id]);
  const getOwnedRatchets=()=>RATCHETS.filter(r=>col.ratchets?.[r.id]);
  const getOwnedBits=()=>BITS.filter(b=>col.bits?.[b.id]);

  const analyzeCollection=()=>{
    const blades=getOwnedBlades();
    if(!blades.length)return"You don't have any blades yet. Start collecting!";
    const typeCount={Attack:0,Defense:0,Stamina:0,Balance:0};
    const tierCount={"S+":0,S:0,A:0,B:0,C:0};
    blades.forEach(b=>{typeCount[b.type]++; tierCount[b.tier]++});
    const deck=genDeck(Object.keys(col.blades||{}),Object.keys(col.ratchets||{}),Object.keys(col.bits||{}));
    let text=`📊 Collection Analysis:\n${blades.length} blades (${Object.values(typeCount).join(" / ")} types). Top tier: ${Object.keys(tierCount).filter(k=>tierCount[k]>0).pop()}.`;
    if(deck)text+=`\n✓ Suggested deck: ${deck.map(c=>`${c.blade.name}(${c.role[0]})`).join(" + ")}`;
    return text;
  };

  const getCounterAdvice=(oppType)=>{
    const counters={Attack:"Defense",Defense:"Stamina",Stamina:"Attack"};
    const counter=counters[oppType];
    const suitable=getOwnedBlades().filter(b=>b.type===counter).sort((a,b)=>TS[b.tier]-TS[a.tier]).slice(0,3);
    if(!suitable.length)return`No ${counter} blades owned. Type advantage: ${counter} beats ${oppType}!`;
    return`⚔️ vs ${oppType}: Use ${counter} type. Best picks: ${suitable.map(b=>b.name).join(", ")}. Lock center, control stamina!`;
  };

  const getMetaPicks=()=>{
    const meta=BLADES.filter(b=>["S+","S"].includes(b.tier)).slice(0,5);
    const owned=getOwnedBlades();
    const have=meta.filter(m=>owned.find(o=>o.id===m.id));
    let text=`🏆 Meta S+ & S blades: ${meta.map(b=>`${b.name}(${b.type[0]})`).join(", ")}`;
    if(have.length)text+=`\nYou own: ${have.map(h=>h.name).join(", ")}`;
    return text;
  };

  const analyzeWinRate=()=>{
    if(!matchHistory.length)return"No matches recorded yet. Play to build history!";
    const wins=matchHistory.filter(m=>m.myScore>m.oppScore).length;
    const wr=Math.round(wins/matchHistory.length*100);
    const byType={Attack:{w:0,l:0},Defense:{w:0,l:0},Stamina:{w:0,l:0},Balance:{w:0,l:0}};
    matchHistory.forEach(m=>{
      if(byType[m.oppType]){
        if(m.myScore>m.oppScore)byType[m.oppType].w++;
        else byType[m.oppType].l++;
      }
    });
    const best=Object.keys(byType).reduce((a,t)=>byType[t].w/(byType[t].w+byType[t].l||1)>byType[a].w/(byType[a].w+byType[a].l||1)?t:a);
    return`📈 Win Rate: ${wr}% (${wins}/${matchHistory.length})\nBest vs: ${best} type. Keep practicing attack patterns!`;
  };

  const getUpgradeSuggestion=()=>{
    const owned=getOwnedBlades();
    const missing=BLADES.filter(b=>!col.blades?.[b.id]&&["S+","S"].includes(b.tier)).slice(0,3);
    const weak=owned.filter(b=>["C","B"].includes(b.tier));
    if(!weak.length)return"Your collection is strong! Focus on specific roles for 3v3.";
    return`💡 Upgrade: Replace ${weak[0].name}(${weak[0].tier}) with S-tier like ${missing[0]?.name}. Higher tier = better stats!`;
  };

  const getLaunchTips=()=>{
    const tips={
      Attack:"🔥 FULL POWER: 15° inward, hit stadium edge in 5s. Burst-risky but KO potential!",
      Defense:"🛡️ SOFT TOUCH: Straight down, centered. Tank hits & control spin.",
      Stamina:"⭐ GENTLE: 5° tilt, minimal wobble. Outspin wins on timer.",
      Balance:"⚖️ ADAPTIVE: 10° angle. Flex to opponent's opener. Versatility key!"
    };
    return`🎯 Launch Technique Guide:\n${Object.entries(tips).map(([t,desc])=>`${t}: ${desc}`).join("\n")}`;
  };

  const getStrategyGuide=()=>{
    return`🎲 3v3 Strategy:\n1. OPENER: Fast, aggressive (Attack/Balance). Win turn 1.\n2. REINFORCER: Mid-game flex (stamina/defense). Adapt & counter.\n3. FINISHER: Heavy hitter or tank. Close-game pressure or defense.\n\nOrder matters! Bluff your strategy—opponent sees you once!`;
  };

  const getMechanicsGuide=()=>{
    return`⚙️ Key Mechanics:\n🦷 RATCHET: Teeth = burst resistance. More teeth = stable but slower launch.\n🎯 BIT: Mobility(M)/Stamina(S)/Stability(B). Attack→M, Stamina→S, Defense→B.\n💨 TYPE TRIANGLE: Attack>Stamina>Defense>Attack. Balance beats itself.\n⏱️ SPIN: Left-spin (L) boosts vs Attack, right-spin neutral.`;
  };

  const processQuery=(q)=>{
    const lower=q.toLowerCase();
    if(/deck|build|team|suggest/.test(lower))return analyzeCollection();
    if(/counter|against|vs/.test(lower)){
      const type=["attack","defense","stamina","balance"].find(t=>lower.includes(t));
      if(type)return getCounterAdvice(type.charAt(0).toUpperCase()+type.slice(1));
      return"Ask: vs Attack/Defense/Stamina/Balance?";
    }
    if(/best|top|meta|tier|s\+|s-tier/.test(lower))return getMetaPicks();
    if(/weak|improve|upgrade|need/.test(lower))return getUpgradeSuggestion();
    if(/stats|record|win|rate|match/.test(lower))return analyzeWinRate();
    if(/launch|shoot|technique|angle|power/.test(lower))return getLaunchTips();
    if(/strateg|3v3|order|opener|finish/.test(lower))return getStrategyGuide();
    if(/ratchet|teeth|burst/.test(lower)||/bit|tip|mobility|stability/.test(lower))return getMechanicsGuide();
    return`🤖 Hey! Ask me:\n• "Analyze my deck"\n• "Counter Attack type"\n• "Best blades?"\n• "My win rate"\n• "Launch tips"\n• "3v3 strategy"\n• "How ratchets work"`;
  };

  const sendMessage=async()=>{
    if(!input.trim())return;
    const userMsg={text:input,sender:"user"};
    setMessages(p=>[...p,userMsg]);
    setInput("");
    setLoading(true);
    setTimeout(()=>{

const MainApp=({t,pseudo,lang,theme,toggleTheme,changeLang,changePseudo,changePwd,resetProfile,replayTutorial})=>{
  const[tab,setTab]=useState("collection");
  const[sub,setSub]=useState("blades");
  const scrollRef=useRef(null);
  const changeTab=(id)=>{setTab(id);if(scrollRef.current)scrollRef.current.scrollTop=0;};
  const[col,setCol]=useState(()=>LS.load("col",{blades:{},ratchets:{},bits:{}}));
  const[wish,setWish]=useState(()=>LS.load("wish",{}));
  const[matchHistory,setMatchHistory]=useState(()=>LS.load("matches",[]));
  useEffect(()=>LS.save("col",col),[col]);
  useEffect(()=>LS.save("wish",wish),[wish]);
  useEffect(()=>LS.save("matches",matchHistory),[matchHistory]);
  const toggleWish=(id)=>setWish(p=>{const n={...p};n[id]?delete n[id]:n[id]=1;return n});
  const addMatch=(m)=>setMatchHistory(p=>[{...m,date:Date.now()},...p].slice(0,20));
  const aiReady=useAIStatus();
  const toggle=(cat,id)=>setCol(p=>{const c={...p[cat]};c[id]?delete c[id]:c[id]=1;return{...p,[cat]:c}});

  // ── Popup states ──
  const[popups,setPopups]=useState({pickBlades:false,pickRatchets:false,pickBits:false,toDeck:false,toBattle:false,toTips:false});
  const shownRef=useRef({pickBlades:false,pickRatchets:false,pickBits:false,toDeck:false,toBattle:false,toTips:false});
  const deckTimerRef=useRef(null);
  const[battleUsed,setBattleUsed]=useState(false);

  // Onboarding 1: Welcome → pick 3 blades (on first load, after 500ms)
  useEffect(()=>{
    if(!shownRef.current.pickBlades&&tab==="collection"&&Object.keys(col.blades).length===0){
      shownRef.current.pickBlades=true;
      setTimeout(()=>setPopups(p=>({...p,pickBlades:true})),500);
    }
  },[tab]);

  // Onboarding 2: 3+ blades selected → now pick ratchets
  useEffect(()=>{
    const bC=Object.keys(col.blades).length;
    if(bC>=3&&!shownRef.current.pickRatchets&&tab==="collection"){
      shownRef.current.pickRatchets=true;
      setTimeout(()=>setPopups(p=>({...p,pickRatchets:true})),300);
    }
  },[col.blades,tab]);

  // Onboarding 3: 3+ ratchets selected → now pick bits
  useEffect(()=>{
    const rC=Object.keys(col.ratchets).length;
    if(rC>=3&&shownRef.current.pickRatchets&&!shownRef.current.pickBits&&tab==="collection"){
      shownRef.current.pickBits=true;
      setTimeout(()=>setPopups(p=>({...p,pickBits:true})),300);
    }
  },[col.ratchets,tab]);

  // Popup 4: Collection → Deck (when 3+ blades, 3+ ratchets, 3+ bits)
  useEffect(()=>{
    const bC=Object.keys(col.blades).length,rC=Object.keys(col.ratchets).length,biC=Object.keys(col.bits).length;
    if(bC>=3&&rC>=3&&biC>=3&&!shownRef.current.toDeck&&tab==="collection"){
      shownRef.current.toDeck=true;
      setTimeout(()=>setPopups(p=>({...p,toDeck:true})),400);
    }
  },[col,tab]);

  // Popup 5: Deck → Battle (after 10s on deck tab)
  useEffect(()=>{
    if(tab==="deck"&&!shownRef.current.toBattle){
      deckTimerRef.current=setTimeout(()=>{
        shownRef.current.toBattle=true;
        setPopups(p=>({...p,toBattle:true}));
      },10000);
    }
    return()=>{if(deckTimerRef.current)clearTimeout(deckTimerRef.current)};
  },[tab]);

  // Popup 6: Battle → Tips (after counter-picking used)
  useEffect(()=>{
    if(battleUsed&&!shownRef.current.toTips&&tab==="battle"){
      shownRef.current.toTips=true;
      setTimeout(()=>setPopups(p=>({...p,toTips:true})),600);
    }
  },[battleUsed,tab]);

  const totalOwned=Object.keys(col.blades).length+Object.keys(col.ratchets).length+Object.keys(col.bits).length;
  const navItems=[
    {id:"collection",label:t.collection,badge:totalOwned||null,icon:<img src={IMG.navCol} width={22} height={22} style={{objectFit:"contain"}}/>},
    {id:"deck",label:t.deck,icon:<img src={IMG.navDeck} width={22} height={22} style={{objectFit:"contain"}}/>},
    {id:"battle",label:t.battle,icon:<img src={IMG.navBattle} width={22} height={22} style={{objectFit:"contain"}}/>},
    {id:"ai",label:t.ai_coach||"AI",icon:<svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2a4 4 0 014 4v1h2a2 2 0 012 2v4a8 8 0 01-16 0V9a2 2 0 012-2h2V6a4 4 0 014-4z"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/><path d="M9 16c1 1 5 1 6 0"/></svg>},
    {id:"market",label:t.market||"Market",icon:<img src={IMG.navMarket} width={22} height={22} style={{objectFit:"contain"}}/>}
    ];
  return(
    <BG><div style={{display:"flex",flexDirection:"column",height:"100vh",position:"relative",zIndex:1,maxWidth:520,margin:"0 auto"}}>
      <div style={{padding:"8px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:`1px solid ${C.border}22`,background:TH==="dark"?"rgba(8,6,32,0.9)":"rgba(245,243,255,0.9)",backdropFilter:"blur(10px)",minHeight:48,paddingTop:`max(8px, env(safe-area-inset-top))`}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <img src={IMG.banner} height={24} style={{objectFit:"contain",filter:"drop-shadow(0 0 6px rgba(99,102,241,0.5))"}}/>
          {aiReady&&<span style={{background:`linear-gradient(135deg,${C.aiGold},#F59E0B)`,color:"#000",fontSize:7,fontWeight:900,padding:"2px 5px",borderRadius:4}}>AI</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:10,color:C.textMut}}>{pseudo}</span>
          <div onClick={()=>changeTab("tips")} style={{width:32,height:32,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:tab==="tips"?`${C.primary}22`:"transparent"}}><img src={IMG.navTips} width={18} height={18} style={{objectFit:"contain",opacity:tab==="tips"?1:0.5}}/></div>
          <div onClick={()=>changeTab("settings")} style={{width:32,height:32,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:tab==="settings"?`${C.primary}22`:"transparent"}}><svg width={18} height={18} viewBox="0 0 24 24" fill="none" stroke={tab==="settings"?C.primary:C.textMut} strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
        </div>
      </div>
      <div ref={scrollRef} style={{flex:1,overflow:"auto",WebkitOverflowScrolling:"touch",padding:"6px 12px 100px"}}><div key={tab} style={{animation:"tabIn 0.15s ease-out"}}>
        {tab==="collection"&&<CollectionTab col={col} toggle={toggle} t={t} sub={sub} setSub={setSub}/>}
        {tab==="deck"&&<DeckTab col={col} t={t} lang={lang} aiReady={aiReady}/>}
        {tab==="battle"&&<BattleTab col={col} t={t} lang={lang} aiReady={aiReady} onCounterPick={()=>setBattleUsed(true)} matchHistory={matchHistory} addMatch={addMatch}/>}
        {tab==="tips"&&<TipsTab t={t} lang={lang} aiReady={aiReady}/>}
        {tab==="ai"&&<AICoachTab t={t} col={col} matchHistory={matchHistory} lang={lang}/>}
        {tab==="market"&&<MarketTab t={t} col={col} wish={wish} toggleWish={toggleWish}/>}
        {tab==="settings"&&<SettingsTab t={t} lang={lang} pseudo={pseudo} theme={theme} toggleTheme={toggleTheme} changeLang={changeLang} changePseudo={changePseudo} changePwd={changePwd} resetProfile={resetProfile} replayTutorial={replayTutorial} col={col} setCol={setCol} wish={wish} matchHistory={matchHistory}/>}
      </div></div>
      {false&&<div style={{background:`linear-gradient(90deg,${C.bgCard},${C.bg},${C.bgCard})`,borderTop:`1px solid ${C.border}22`,textAlign:"center",padding:"5px 0",fontSize:9,color:C.textMut,letterSpacing:1.5,opacity:0.5}}>{t.ad_text}</div>}
      <div className="safe-bottom" style={{display:"flex",background:TH==="dark"?"linear-gradient(180deg, rgba(18,16,46,0.98), rgba(8,6,32,0.99))":"linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,243,255,0.99))",borderTop:`1px solid ${C.border}33`,boxShadow:"0 -2px 12px rgba(0,0,0,0.2)"}}>
        {navItems.map(n=>(
          <div key={n.id} onClick={()=>changeTab(n.id)} style={{flex:1,padding:"10px 0 8px",textAlign:"center",cursor:"pointer",color:tab===n.id?C.primary:C.textMut,transition:"color 0.15s",borderTop:tab===n.id?`2px solid ${C.primary}`:"2px solid transparent",background:tab===n.id?`${C.primary}0A`:"transparent",minHeight:52}}>
            <div style={{display:"flex",justifyContent:"center",marginBottom:2,opacity:tab===n.id?1:0.45,position:"relative"}}>{n.icon}{n.badge?<span style={{position:"absolute",top:-5,right:"calc(50% - 20px)",background:C.accent,color:"#fff",fontSize:7,fontWeight:800,padding:"1px 4px",borderRadius:6,minWidth:14,textAlign:"center"}}>{n.badge}</span>:null}</div>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:0.3}}>{n.label}</div>
          </div>
        ))}
      </div>
      <Popup show={popups.pickBlades} emoji="🎉" title={t.popup_pick_blades_title||"Welcome! 🎉"} desc={t.popup_pick_blades_desc||"Start by selecting 3 Blades you own!"} btnText={t.popup_pick_blades_btn||"Pick Blades"} laterText={t.popup_later||"Later"}
        onAction={()=>{setPopups(p=>({...p,pickBlades:false}));setSub("blades")}}
        onClose={()=>setPopups(p=>({...p,pickBlades:false}))}/>
      <Popup show={popups.pickRatchets} emoji="⚙️" title={t.popup_pick_ratchets_title||"Pick Ratchets! ⚙️"} desc={t.popup_pick_ratchets_desc||"Now select 3 Ratchets!"} btnText={t.popup_pick_ratchets_btn||"Pick Ratchets"} laterText={t.popup_later||"Later"}
        onAction={()=>{setPopups(p=>({...p,pickRatchets:false}));setSub("ratchets")}}
        onClose={()=>setPopups(p=>({...p,pickRatchets:false}))}/>
      <Popup show={popups.pickBits} emoji="🔩" title={t.popup_pick_bits_title||"Pick Bits! 🔩"} desc={t.popup_pick_bits_desc||"Finally, select 3 Bits!"} btnText={t.popup_pick_bits_btn||"Pick Bits"} laterText={t.popup_later||"Later"}
        onAction={()=>{setPopups(p=>({...p,pickBits:false}));setSub("bits")}}
        onClose={()=>setPopups(p=>({...p,pickBits:false}))}/>
      <Popup show={popups.toDeck} emoji="🎉" title={t.popup_deck_title||"Collection Ready!"} desc={t.popup_deck_desc||"You have enough parts for your 3v3 deck!"} btnText={t.popup_deck_btn||"View My Deck"} laterText={t.popup_later||"Later"}
        onAction={()=>{setPopups(p=>({...p,toDeck:false}));setTab("deck")}}
        onClose={()=>setPopups(p=>({...p,toDeck:false}))}/>
      <Popup show={popups.toBattle} emoji="⚔️" title={t.popup_battle_title||"Ready to Battle?"} desc={t.popup_battle_desc||"Your deck is ready! Find the best counter-picks."} btnText={t.popup_battle_btn||"Battle Mode"} laterText={t.popup_later||"Later"}
        onAction={()=>{setPopups(p=>({...p,toBattle:false}));setTab("battle")}}
        onClose={()=>setPopups(p=>({...p,toBattle:false}))}/>
      <Popup show={popups.toTips} emoji="💡" title={t.popup_tips_title||"Become a Pro!"} desc={t.popup_tips_desc||"Check Tips for advanced strategies."} btnText={t.popup_tips_btn||"View Tips"} laterText={t.popup_later||"Later"}
        onAction={()=>{setPopups(p=>({...p,toTips:false}));setTab("tips")}}
        onClose={()=>setPopups(p=>({...p,toTips:false}))}/>
    </div></BG>
  );
};

// ─── ROOT ────────────────────────────────────────────────
function App(){
  const savedLang=LS.load("lang",null);
  const savedPseudo=LS.load("pseudo","");
  const savedPwd=LS.load("pwd","");
  const savedTheme=LS.load("theme","dark");
  const hasAccount=savedLang&&savedPseudo&&savedPwd;
  const[screen,setScreen]=useState(hasAccount?"login":"lang");
  const[lang,setLang]=useState(savedLang||"ja");
  const[pseudo,setPseudo]=useState(savedPseudo||"");
  const[theme,setTheme]=useState(savedTheme);
  TH=theme;syncTheme();
  useEffect(()=>{document.body.style.background=C.bg;document.body.style.color=C.text},[theme]);
  const t=T[lang]||T.en;
  const goLang=(l)=>{setLang(l);LS.save("lang",l);setScreen("signup")};
  const goSignup=(p,pwd)=>{setPseudo(p);LS.save("pseudo",p);LS.save("pwd",btoa(pwd));setScreen("app")};
  const replayTutorial=()=>{};
  const changeLang=(l)=>{setLang(l);LS.save("lang",l)};
  const changePseudo=(p)=>{setPseudo(p);LS.save("pseudo",p)};
  const changePwd=(oldP,newP)=>{const oldH=btoa(oldP);if(oldH===LS.load("pwd","")){LS.save("pwd",btoa(newP));return true}return false};
  const toggleTheme=()=>{const nt=theme==="dark"?"light":"dark";setTheme(nt);TH=nt;LS.save("theme",nt)};
  const resetProfile=()=>{localStorage.clear();window.location.reload()};
  if(screen==="login")return<LoginScreen t={t} pseudo={savedPseudo} onLogin={()=>setScreen("app")} onReset={resetProfile}/>;
  if(screen==="lang")return<LangScreen onSelect={goLang}/>;
  if(screen==="signup")return<SignupScreen t={t} lang={lang} onSubmit={goSignup} onBack={()=>setScreen("lang")}/>;
  return<MainApp t={t} pseudo={pseudo} lang={lang} theme={theme} toggleTheme={toggleTheme} changeLang={changeLang} changePseudo={changePseudo} changePwd={changePwd} resetProfile={resetProfile} replayTutorial={replayTutorial}/>;
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
</script>
</body>
</html>
